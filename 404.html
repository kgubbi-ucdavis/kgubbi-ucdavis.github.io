<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Kevin Immanuel Gubbi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="error-page">
        <div class="terminal-window">
            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="terminal-title">bash</span>
            </div>
            <div class="terminal-body">
                <p><span class="prompt">$</span> find / -name "page"</p>
                <p class="error-output">Error 404: Page not found</p>
                <p><span class="prompt">$</span> <a href="/">cd ~</a><span class="blink">_</span></p>
            </div>
        </div>
    </div>

</body>
</html>
